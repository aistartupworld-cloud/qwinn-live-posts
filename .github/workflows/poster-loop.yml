name: Poster loop
# Keeps one runner alive that checks every minute and posts each IST hour's
# approved question as soon as the hour starts. A run lasts about 5h45m, then
# starts the next run itself, so posting does not depend on GitHub's timer.
# The hourly schedule below is only a backup to restart the chain if it breaks.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
concurrency: { group: poster, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow (draws the winner Story image)
        run: pip install -q pillow
      - name: Post every hour for about 5h45m
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          git config user.name "qwinn-bot"; git config user.email "qwinn-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 345*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase origin main || true
            rc=0; python3 scripts/post_instagram.py || rc=$?
            if [ $rc -eq 0 ]; then pause=60
            elif [ $rc -eq 3 ]; then echo "::warning::Instagram is blocking or rate-limiting posts; waiting an hour before trying again"; pause=3600
            else echo "::warning::post attempt failed, retrying in 5 minutes"; pause=300; fi
            python3 scripts/draw.py || echo "::warning::draw step failed, retrying next minute"
            python3 scripts/winner_story.py || echo "::warning::winner Story failed, retrying next minute"
            if [ -n "$(git status --porcelain posted.json draws answers)" ]; then
              git add posted.json draws answers && git commit -qm "Log posted slot / draw result" && (git push -q || (git pull -q --rebase origin main && git push -q))
            fi
            sleep "$pause"
          done
      - name: Start the next run
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run poster-loop.yml --repo "$GITHUB_REPOSITORY" --ref main
