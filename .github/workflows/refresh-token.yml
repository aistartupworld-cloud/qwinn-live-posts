name: Refresh Instagram token
on:
  schedule:
    - cron: "0 3 1,15 * *"   # 1st and 15th of each month
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: r
        env: { IG_ACCESS_TOKEN: "${{ secrets.IG_ACCESS_TOKEN }}" }
        run: python3 scripts/refresh_token.py
      - name: Save new token as secret
        env: { GH_TOKEN: "${{ secrets.GH_PAT }}" }
        run: gh secret set IG_ACCESS_TOKEN --body "${{ steps.r.outputs.token }}" --repo "$GITHUB_REPOSITORY"
