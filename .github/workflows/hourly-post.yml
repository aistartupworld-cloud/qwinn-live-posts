name: Hourly Instagram post (manual)
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Post a specific slot now, IST, e.g. 2026-11-01 14 (leave empty for the coming hour)"
        required: false
      announce:
        description: "Post a one-off image now, e.g. posts/announce/2026-11-06-winner (needs .jpg and .txt)"
        required: false
      check_only:
        description: "1 = only check the Instagram token works (posts nothing)"
        required: false
        default: "0"
      dry_run:
        description: "1 = only print what would be posted"
        required: false
        default: "0"
concurrency: { group: manual-post, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Post to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SLOT: ${{ inputs.slot }}
          ANNOUNCE: ${{ inputs.announce }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: python3 scripts/post_instagram.py
      - name: Save posted log
        run: |
          git config user.name "qwinn-bot"; git config user.email "qwinn-bot@users.noreply.github.com"
          git add posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Log posted slot" && git pull --rebase && git push)
